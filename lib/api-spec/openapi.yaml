openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session authentication
  - name: courses
    description: Course catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Created account and session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Session cleared
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /creator/upgrade:
    post:
      operationId: upgradeCreator
      tags: [auth]
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Creator account
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401": { description: Authentication required }
        "403": { description: Forbidden }
  /marketplace/courses:
    get:
      operationId: marketplaceCourses
      tags: [courses]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Filtered marketplace courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200": { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } } }
  /marketplace/products:
    get:
      operationId: listProducts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: integer } }
      responses:
        "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } }
  /marketplace/products/{id}:
    get:
      operationId: getProduct
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }, "404": { description: Not found } }
  /marketplace/courses/{id}:
    get:
      operationId: getMarketplaceCourse
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Course, content: { application/json: { schema: { $ref: "#/components/schemas/Course" } } } }, "404": { description: Not found } }
  /student/courses/{courseId}/enroll:
    post:
      operationId: enrollInCourse
      security: [{ cookieAuth: [] }]
      parameters: [{ name: courseId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentResult" } } } }
        "401": { description: Authentication required }
        "404": { description: Published course not found }
  /creator/products:
    get:
      operationId: listCreatorProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } }
    post:
      operationId: createCreatorProduct
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/products/{id}:
    patch:
      operationId: updateCreatorProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/products/{id}/publish:
    post:
      operationId: publishCreatorProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/products/{productId}/builder:
    get:
      operationId: getCreatorCourseBuilder
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Course builder, content: { application/json: { schema: { $ref: "#/components/schemas/CourseBuilder" } } } } }
    patch:
      operationId: updateCreatorCourseBasics
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CourseBasicsInput" } } } }
      responses: { "200": { description: Updated course, content: { application/json: { schema: { type: object } } } } }
  /creator/products/{productId}/thumbnail/request-upload:
    post:
      operationId: requestCourseThumbnailUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ImageUploadInput" } } } }
      responses: { "201": { description: Presigned thumbnail upload, content: { application/json: { schema: { $ref: "#/components/schemas/ImageUploadResponse" } } } } }
  /creator/products/{productId}/thumbnail/finalize:
    post:
      operationId: finalizeCourseThumbnailUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ImageFinalizeInput" } } } }
      responses: { "200": { description: Thumbnail saved, content: { application/json: { schema: { type: object } } } } }
  /creator/products/{productId}/readiness:
    get:
      operationId: getCreatorCourseReadiness
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Readiness, content: { application/json: { schema: { $ref: "#/components/schemas/CourseReadiness" } } } } }
  /creator/products/{productId}/publish-course:
    post:
      operationId: publishCreatorCourse
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Published course and product, content: { application/json: { schema: { type: object } } } }, "422": { description: Course is not ready } }
  /creator/products/{productId}/modules:
    post:
      operationId: createCreatorCourseModule
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleInput" } } } }
      responses: { "201": { description: Created module, content: { application/json: { schema: { $ref: "#/components/schemas/Module" } } } } }
  /creator/products/{productId}/modules/reorder:
    post:
      operationId: reorderCreatorCourseModules
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleReorderInput" } } } }
      responses: { "200": { description: Reordered } }
  /creator/modules/{moduleId}:
    patch:
      operationId: updateCreatorCourseModule
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleInput" } } } }
      responses: { "200": { description: Updated module } }
    delete:
      operationId: deleteCreatorCourseModule
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /creator/modules/{moduleId}/lessons:
    post:
      operationId: createCreatorCourseLesson
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonInput" } } } }
      responses: { "201": { description: Created lesson, content: { application/json: { schema: { $ref: "#/components/schemas/Lesson" } } } } }
  /creator/modules/{moduleId}/lessons/reorder:
    post:
      operationId: reorderCreatorCourseLessons
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonReorderInput" } } } }
      responses: { "200": { description: Reordered } }
  /creator/lessons/{lessonId}:
    patch:
      operationId: updateCreatorCourseLesson
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonInput" } } } }
      responses: { "200": { description: Updated lesson } }
    delete:
      operationId: deleteCreatorCourseLesson
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /creator/sales-summary:
    get:
      operationId: creatorSalesSummary
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/SalesSummary" } } } } }
  /student/library:
    get:
      operationId: studentLibrary
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Library, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/products/purchased:
    get:
      operationId: purchasedProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Purchases, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/orders:
    get:
      operationId: studentOrders
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Orders, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/wishlist:
    get:
      operationId: listWishlist
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Wishlist, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/wishlist/{productId}:
    post:
      operationId: addWishlist
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "201": { description: Added, content: { application/json: { schema: { type: object } } } } }
    delete:
      operationId: removeWishlist
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Removed } }
  /admin/users:
    get:
      operationId: adminUsers
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } } }
  /admin/creators:
    get:
      operationId: adminCreators
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Creators, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } } }
  /admin/courses:
    get:
      operationId: adminCourses
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Courses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCourse" } } } } } }
    post:
      operationId: adminCreateCourse
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCourseInput" }
      responses:
        "201": { description: Created course and product, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreatedCourse" } } } }
  /admin/course-studio/courses:
    get:
      operationId: adminCourseStudioCourses
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Course studio courses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCourse" } } } } }
  /admin/ai/course-outline:
    post:
      operationId: adminCourseOutline
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CourseOutlineInput" } } } }
      responses: { "200": { description: Draft outline, content: { application/json: { schema: { $ref: "#/components/schemas/CourseOutline" } } } } }
  /creator/lessons/{lessonId}/assets/request-upload:
    post:
      operationId: requestLessonVideoUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VideoUploadInput" } } } }
      responses: { "201": { description: Presigned upload, content: { application/json: { schema: { $ref: "#/components/schemas/VideoUploadResponse" } } } } }
  /creator/lessons/{lessonId}/assets/{assetId}/finalize:
    post:
      operationId: finalizeLessonVideoUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }, { name: assetId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Finalized asset, content: { application/json: { schema: { $ref: "#/components/schemas/LessonAsset" } } } } }
  /creator/assets/{assetId}/download:
    get:
      operationId: downloadLessonAsset
      security: [{ cookieAuth: [] }]
      parameters: [{ name: assetId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Private video stream } }
    delete:
      operationId: removeLessonAsset
      security: [{ cookieAuth: [] }]
      parameters: [{ name: assetId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Video removed } }
  /admin/products:
    get:
      operationId: adminProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } }
  /admin/orders:
    get:
      operationId: adminOrders
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Orders, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /admin/categories:
    post:
      operationId: adminCreateCategory
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } } }
  /admin/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } } }
    delete:
      operationId: adminDeleteCategory
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /admin/settings:
    get:
      operationId: adminSettings
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Settings, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /admin/settings/{key}:
    patch:
      operationId: adminUpdateSetting
      security: [{ cookieAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUpdateSettingInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { type: object } } } } }
  /creator/products/{productId}/live-classes:
    get:
      operationId: listCreatorLiveClasses
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Live classes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LiveClass" } } } } } }
    post:
      operationId: createLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClassInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } }, "422": { description: Invalid schedule } }
  /live-classes:
    get:
      operationId: listUpcomingLiveClasses
      security: [{ cookieAuth: [] }]
      parameters: [{ name: courseId, in: query, required: true, schema: { type: integer } }]
      responses: { "200": { description: Enrolled course classes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LiveClass" } } } } } }
  /creator/live-classes/{id}:
    patch:
      operationId: updateLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClassInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } } }
    delete:
      operationId: deleteLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /creator/live-classes/{id}/cancel:
    post:
      operationId: cancelLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Cancelled, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } } }
  /creator/live-classes/{id}/complete:
    post:
      operationId: completeLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Completed, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } } }
  /creator/live-classes/{id}/attendance:
    get:
      operationId: listLiveClassAttendance
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          description: Attendance report
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LiveClassAttendance" }
  /live-classes/{id}/join:
    post:
      operationId: joinLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: LiveKit credentials, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClassJoin" } } } } }
  /live-classes/{id}/attendance/join:
    post:
      operationId: recordLiveClassJoin
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Attendance recorded } }
  /live-classes/{id}/attendance/leave:
    post:
      operationId: recordLiveClassLeave
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Attendance recorded } }
  /creator/live-classes/{id}/recording/start:
    post:
      operationId: startLiveClassRecording
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Recording started, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } }, "422": { description: Recording destination not configured } }
  /creator/live-classes/{id}/recording/stop:
    post:
      operationId: stopLiveClassRecording
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Recording stopped, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lms_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    SignUpInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    CourseBasicsInput:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        level: { type: string }
        outcomes: { type: array, items: { type: string } }
        faqs: { type: array, items: { $ref: "#/components/schemas/CourseFaq" } }
    ImageUploadInput:
      type: object
      required: [filename, mimeType, sizeBytes]
      properties:
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
    ImageUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    ImageFinalizeInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
    ModuleInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
    LessonInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        isPreview: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/LessonAsset" } }
    ModuleReorderInput:
      type: object
      required: [moduleIds]
      properties:
        moduleIds: { type: array, items: { type: integer } }
    LessonReorderInput:
      type: object
      required: [lessonIds]
      properties:
        lessonIds: { type: array, items: { type: integer } }
    Lesson:
      type: object
      required: [id, moduleId, title, position, isPreview]
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        position: { type: integer }
        isPreview: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/LessonAsset" } }
    Module:
      type: object
      required: [id, courseId, title, position]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        position: { type: integer }
        lessons: { type: array, items: { $ref: "#/components/schemas/Lesson" } }
    CourseBuilder:
      type: object
      required: [product, course, modules]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        course: { type: object }
        modules: { type: array, items: { $ref: "#/components/schemas/Module" } }
    CourseReadiness:
      type: object
      required: [ready, checks, moduleCount, lessonCount]
      properties:
        ready: { type: boolean }
        checks: { type: object, additionalProperties: { type: boolean } }
        moduleCount: { type: integer }
        lessonCount: { type: integer }
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, creator, admin]
    Course:
      type: object
      required: [id, title, description, level, lessons]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        outcomes:
          type: array
          items: { type: string }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/CourseFaq" }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
        creatorName:
          type: ["string", "null"]
        enrolled:
          type: boolean
        level:
          type: string
        lessons:
          type: integer
        productId:
          type: integer
          nullable: true
    CourseFaq:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
    EnrollmentResult:
      type: object
      required: [enrolled, alreadyEnrolled, courseId]
      properties:
        enrolled: { type: boolean }
        alreadyEnrolled: { type: boolean }
        courseId: { type: integer }
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
    Product:
      type: object
      required: [id, title, description, type, priceMinor, currency, status]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        type: { type: string, enum: [course, digital] }
        priceMinor: { type: integer, minimum: 0 }
        currency: { type: string }
        status: { type: string, enum: [draft, published, archived] }
    ProductInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        type: { type: string, enum: [course, digital] }
        priceMinor: { type: integer, minimum: 0 }
        currency: { type: string }
        courseId: { type: integer }
        categoryId: { type: integer }
    AdminCourseInput:
      type: object
      required: [creatorId, title, description, priceMinor, currency]
      properties:
        creatorId: { type: integer }
        title: { type: string, minLength: 2 }
        description: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    AdminCreatedCourse:
      type: object
      required: [courseId, productId]
      properties:
        courseId: { type: integer }
        productId: { type: integer }
    AdminCourse:
      type: object
      required: [id, title, description, status, priceMinor, currency, productId, creatorId, creatorName, creatorEmail, moduleCount, lessonCount]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        priceMinor: { type: integer }
        currency: { type: string }
        productId: { type: integer, nullable: true }
        creatorId: { type: integer }
        creatorName: { type: string }
        creatorEmail: { type: string }
        moduleCount: { type: integer }
        lessonCount: { type: integer }
    VideoUploadInput:
      type: object
      required: [filename, mimeType, sizeBytes]
      properties:
        filename: { type: string }
        mimeType: { type: string, pattern: "^video/" }
        sizeBytes: { type: integer, minimum: 1, maximum: 1073741824 }
    LessonAsset:
      type: object
      required: [id, lessonId, kind, storageKey, objectPath, filename, mimeType, sizeBytes, status]
      properties:
        id: { type: integer }
        lessonId: { type: integer }
        kind: { type: string, enum: [video] }
        storageKey: { type: string }
        objectPath: { type: string }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string, enum: [pending, uploaded, failed] }
    VideoUploadResponse:
      type: object
      required: [uploadURL, asset]
      properties:
        uploadURL: { type: string, format: uri }
        asset: { $ref: "#/components/schemas/LessonAsset" }
    CourseOutlineInput:
      type: object
      required: [topic, audience, level, sectionCount]
      properties:
        topic: { type: string }
        audience: { type: string }
        level: { type: string }
        sectionCount: { type: integer, minimum: 1, maximum: 20 }
    CourseOutline:
      type: object
      required: [title, description, sections]
      properties:
        title: { type: string }
        description: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [title, lessons]
            properties:
              title: { type: string }
              lessons:
                type: array
                items:
                  type: object
                  required: [title]
                  properties:
                    title: { type: string }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
    AdminUpdateSettingInput:
      type: object
      required: [value]
      properties:
        value: { type: string }
    SalesSummary:
      type: object
      required: [orderCount, grossMinor, orders]
      properties:
        orderCount: { type: integer }
        grossMinor: { type: integer }
        orders: { type: array, items: { type: object } }
    LiveClassInput:
      type: object
      required: [title, startsAt, endsAt, timezone]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1 }
    LiveClass:
      type: object
      required: [id, courseId, creatorId, title, description, startsAt, endsAt, timezone, status, roomName, recordingStatus, recordingUrl, createdAt, updatedAt]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        creatorId: { type: integer }
        title: { type: string }
        description: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timezone: { type: string }
        status: { type: string, enum: [scheduled, live, completed, cancelled] }
        roomName: { type: string }
        recordingStatus: { type: string, enum: [idle, recording, processing, ready, failed] }
        recordingUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LiveClassJoin:
      type: object
      required: [serverUrl, token, class, participantRole]
      properties:
        serverUrl: { type: string }
        token: { type: string }
        class: { $ref: "#/components/schemas/LiveClass" }
        participantRole: { type: string, enum: [host, student] }
    LiveClassAttendance:
      type: object
      required: [id, liveClassId, userId, name, email, role, firstJoinedAt, lastLeftAt, durationSeconds, joinCount]
      properties:
        id: { type: integer }
        liveClassId: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [host, student] }
        firstJoinedAt: { type: string, format: date-time }
        lastLeftAt: { type: ["string", "null"], format: date-time }
        durationSeconds: { type: integer }
        joinCount: { type: integer }

