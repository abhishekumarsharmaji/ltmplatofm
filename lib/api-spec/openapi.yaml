openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Session authentication
  - name: courses
    description: Course catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Created account and session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "204":
          description: Session cleared
  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /creator-applications/me:
    get:
      operationId: getMyCreatorApplication
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Current application, content: { application/json: { schema: { anyOf: [{ $ref: "#/components/schemas/CreatorApplication" }, { type: "null" }] } } } }
  /creator-applications:
    post:
      operationId: submitCreatorApplication
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreatorApplicationInput" } } } }
      responses: { "200": { description: Updated application, content: { application/json: { schema: { $ref: "#/components/schemas/CreatorApplication" } } } }, "201": { description: Submitted, content: { application/json: { schema: { $ref: "#/components/schemas/CreatorApplication" } } } } }
  /admin/creator-applications:
    get:
      operationId: adminCreatorApplications
      security: [{ cookieAuth: [] }]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }]
      responses: { "200": { description: Applications, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /admin/creator-applications/{id}/approve:
    post:
      operationId: approveCreatorApplication
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Approved application, content: { application/json: { schema: { $ref: "#/components/schemas/CreatorApplication" } } } } }
  /admin/creator-applications/{id}/reject:
    post:
      operationId: rejectCreatorApplication
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RejectCreatorApplicationInput" } } } }
      responses: { "200": { description: Rejected application, content: { application/json: { schema: { $ref: "#/components/schemas/CreatorApplication" } } } } }
  /marketplace/courses:
    get:
      operationId: marketplaceCourses
      tags: [courses]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Filtered marketplace courses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Course" }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200": { description: Categories, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Category" } } } } }
  /marketplace/products:
    get:
      operationId: listProducts
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: integer } }
      responses:
        "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } }
  /marketplace/products/{id}:
    get:
      operationId: getProduct
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Product, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } }, "404": { description: Not found } }
  /marketplace/courses/{id}:
    get:
      operationId: getMarketplaceCourse
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Course, content: { application/json: { schema: { $ref: "#/components/schemas/Course" } } } }, "404": { description: Not found } }
  /student/courses/{courseId}/enroll:
    post:
      operationId: enrollInCourse
      security: [{ cookieAuth: [] }]
      parameters: [{ name: courseId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Enrolled, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentResult" } } } }
        "401": { description: Authentication required }
        "404": { description: Published course not found }
  /student/courses/{courseId}:
    get:
      operationId: getStudentCourse
      security: [{ cookieAuth: [] }]
      parameters: [{ name: courseId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200": { description: Enrolled course with playable lessons, content: { application/json: { schema: { $ref: "#/components/schemas/StudentCourse" } } } }
        "403": { description: Enrollment required }
        "404": { description: Course not found }
  /creator/products:
    get:
      operationId: listCreatorProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } }
    post:
      operationId: createCreatorProduct
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/products/{id}:
    patch:
      operationId: updateCreatorProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProductInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/products/{id}/publish:
    post:
      operationId: publishCreatorProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Published, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/products/{productId}/builder:
    get:
      operationId: getCreatorCourseBuilder
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Course builder, content: { application/json: { schema: { $ref: "#/components/schemas/CourseBuilder" } } } } }
    patch:
      operationId: updateCreatorCourseBasics
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CourseBasicsInput" } } } }
      responses: { "200": { description: Updated course, content: { application/json: { schema: { type: object } } } } }
  /creator/products/{productId}/thumbnail/request-upload:
    post:
      operationId: requestCourseThumbnailUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ImageUploadInput" } } } }
      responses: { "201": { description: Presigned thumbnail upload, content: { application/json: { schema: { $ref: "#/components/schemas/ImageUploadResponse" } } } } }
  /creator/products/{productId}/thumbnail/finalize:
    post:
      operationId: finalizeCourseThumbnailUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ImageFinalizeInput" } } } }
      responses: { "200": { description: Thumbnail saved, content: { application/json: { schema: { type: object } } } } }
  /creator/products/{productId}/readiness:
    get:
      operationId: getCreatorCourseReadiness
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Readiness, content: { application/json: { schema: { $ref: "#/components/schemas/CourseReadiness" } } } } }
  /creator/products/{productId}/publish-course:
    post:
      operationId: publishCreatorCourse
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Published course and product, content: { application/json: { schema: { type: object } } } }, "422": { description: Course is not ready } }
  /creator/products/{productId}/modules:
    post:
      operationId: createCreatorCourseModule
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleInput" } } } }
      responses: { "201": { description: Created module, content: { application/json: { schema: { $ref: "#/components/schemas/Module" } } } } }
  /creator/products/{productId}/modules/reorder:
    post:
      operationId: reorderCreatorCourseModules
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleReorderInput" } } } }
      responses: { "200": { description: Reordered } }
  /creator/modules/{moduleId}:
    patch:
      operationId: updateCreatorCourseModule
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ModuleInput" } } } }
      responses: { "200": { description: Updated module } }
    delete:
      operationId: deleteCreatorCourseModule
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /creator/modules/{moduleId}/lessons:
    post:
      operationId: createCreatorCourseLesson
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonInput" } } } }
      responses: { "201": { description: Created lesson, content: { application/json: { schema: { $ref: "#/components/schemas/Lesson" } } } } }
  /creator/modules/{moduleId}/lessons/reorder:
    post:
      operationId: reorderCreatorCourseLessons
      security: [{ cookieAuth: [] }]
      parameters: [{ name: moduleId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonReorderInput" } } } }
      responses: { "200": { description: Reordered } }
  /creator/lessons/{lessonId}:
    patch:
      operationId: updateCreatorCourseLesson
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LessonInput" } } } }
      responses: { "200": { description: Updated lesson } }
    delete:
      operationId: deleteCreatorCourseLesson
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /creator/sales-summary:
    get:
      operationId: creatorSalesSummary
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Summary, content: { application/json: { schema: { $ref: "#/components/schemas/SalesSummary" } } } } }
  /student/library:
    get:
      operationId: studentLibrary
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Library, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/products/purchased:
    get:
      operationId: purchasedProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Purchases, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/orders:
    get:
      operationId: studentOrders
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Orders, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/wishlist:
    get:
      operationId: listWishlist
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Wishlist, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /student/wishlist/{productId}:
    post:
      operationId: addWishlist
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "201": { description: Added, content: { application/json: { schema: { type: object } } } } }
    delete:
      operationId: removeWishlist
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Removed } }
  /admin/users:
    get:
      operationId: adminUsers
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Users, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } } }
  /admin/users/{id}/creator:
    patch:
      operationId: updateAdminUserCreatorRole
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreatorRoleInput" } } } }
      responses: { "200": { description: Updated user, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } } }
  /admin/users/{id}/enrollments:
    get:
      operationId: adminUserEnrollments
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: User enrollments, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
    post:
      operationId: addAdminUserEnrollment
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminEnrollmentInput" } } } }
      responses: { "200": { description: Enrollment result, content: { application/json: { schema: { type: object } } } } }
  /admin/users/{id}/enrollments/{courseId}:
    delete:
      operationId: removeAdminUserEnrollment
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }, { name: courseId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Enrollment removed } }
  /admin/creators:
    get:
      operationId: adminCreators
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Creators, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/User" } } } } } }
  /admin/courses:
    get:
      operationId: adminCourses
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Courses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCourse" } } } } } }
    post:
      operationId: adminCreateCourse
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminCourseInput" }
      responses:
        "201": { description: Created course and product, content: { application/json: { schema: { $ref: "#/components/schemas/AdminCreatedCourse" } } } }
  /admin/course-studio/courses:
    get:
      operationId: adminCourseStudioCourses
      security: [{ cookieAuth: [] }]
      responses:
        "200": { description: Course studio courses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AdminCourse" } } } } }
  /admin/ai/course-outline:
    post:
      operationId: adminCourseOutline
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CourseOutlineInput" } } } }
      responses: { "200": { description: Draft outline, content: { application/json: { schema: { $ref: "#/components/schemas/CourseOutline" } } } } }
  /creator/lessons/{lessonId}/assets/request-upload:
    post:
      operationId: requestLessonVideoUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/VideoUploadInput" } } } }
      responses: { "201": { description: Presigned upload, content: { application/json: { schema: { $ref: "#/components/schemas/VideoUploadResponse" } } } } }
  /creator/lessons/{lessonId}/assets/{assetId}/finalize:
    post:
      operationId: finalizeLessonVideoUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }, { name: assetId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MultipartCompleteInput" } } } }
      responses: { "200": { description: Finalized asset, content: { application/json: { schema: { $ref: "#/components/schemas/LessonAsset" } } } } }
  /creator/lessons/{lessonId}/assets/{assetId}/part-url:
    post:
      operationId: requestLessonVideoPartUrl
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }, { name: assetId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MultipartPartInput" } } } }
      responses: { "200": { description: Presigned part upload, content: { application/json: { schema: { type: object, required: [uploadURL], properties: { uploadURL: { type: string } } } } } } }
  /creator/lessons/{lessonId}/assets/{assetId}/abort:
    post:
      operationId: abortLessonVideoUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: lessonId, in: path, required: true, schema: { type: integer } }, { name: assetId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MultipartAbortInput" } } } }
      responses: { "204": { description: Multipart upload aborted } }
  /creator/assets/{assetId}/download:
    get:
      operationId: downloadLessonAsset
      security: [{ cookieAuth: [] }]
      parameters: [{ name: assetId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Private video stream } }
    delete:
      operationId: removeLessonAsset
      security: [{ cookieAuth: [] }]
      parameters: [{ name: assetId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Video removed } }
  /admin/products:
    get:
      operationId: adminProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Product" } } } } } }
  /admin/orders:
    get:
      operationId: adminOrders
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Orders, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /admin/categories:
    post:
      operationId: adminCreateCategory
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CategoryInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } } }
  /admin/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Category" } } } } }
    delete:
      operationId: adminDeleteCategory
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Deleted } }
  /admin/settings:
    get:
      operationId: adminSettings
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Settings, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
  /admin/settings/{key}:
    patch:
      operationId: adminUpdateSetting
      security: [{ cookieAuth: [] }]
      parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminUpdateSettingInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { type: object } } } } }
  /creator/products/{productId}/live-classes:
    get:
      operationId: listCreatorLiveClasses
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Live classes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LiveClass" } } } } } }
    post:
      operationId: createLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClassInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } }, "422": { description: Invalid schedule } }
  /live-classes:
    get:
      operationId: listUpcomingLiveClasses
      security: [{ cookieAuth: [] }]
      parameters: [{ name: courseId, in: query, required: true, schema: { type: integer } }]
      responses: { "200": { description: Enrolled course classes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LiveClass" } } } } } }
  /creator/live-classes/{id}:
    patch:
      operationId: updateLiveClass
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClassInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } } }
    delete:
      operationId: deleteLiveClass
      security: [{ cookieAuth: [] }]
