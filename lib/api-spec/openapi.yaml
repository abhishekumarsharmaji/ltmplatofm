  /live-classes/{id}/attendance/join:
    post:
      operationId: recordLiveClassJoin
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Attendance recorded } }
  /live-classes/{id}/attendance/leave:
    post:
      operationId: recordLiveClassLeave
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: Attendance recorded } }
  /creator/live-classes/{id}/recording/start:
    post:
      operationId: startLiveClassRecording
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Recording started, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } }, "422": { description: Recording destination not configured } }
  /creator/live-classes/{id}/recording/stop:
    post:
      operationId: stopLiveClassRecording
      security: [{ cookieAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Recording stopped, content: { application/json: { schema: { $ref: "#/components/schemas/LiveClass" } } } } }
  /marketplace/digital-products:
    get:
      operationId: listDigitalProducts
      parameters: [{ name: q, in: query, schema: { type: string } }]
      responses:
        "200": { description: Published free digital products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DigitalProduct" } } } } }
  /marketplace/digital-products/{id}:
    get:
      operationId: getDigitalProduct
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Product detail, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalProductDetail" } } } }, "404": { description: Not found } }
  /creator/digital-products/{productId}/files:
    get:
      operationId: listDigitalProductFiles
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Product files, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DigitalFile" } } } } } }
  /creator/digital-products/{productId}/readiness:
    get:
      operationId: getDigitalProductReadiness
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Readiness, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalProductReadiness" } } } } }
  /creator/digital-products/{productId}/unpublish:
    post:
      operationId: unpublishDigitalProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Unpublished, content: { application/json: { schema: { $ref: "#/components/schemas/Product" } } } } }
  /creator/digital-products/{productId}/files/request-upload:
    post:
      operationId: requestDigitalFileUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalFileUploadInput" } } } }
      responses: { "201": { description: Multipart upload, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalFileUploadResponse" } } } } }
  /creator/digital-products/{productId}/files/{fileId}/part-url:
    post:
      operationId: requestDigitalFilePartUrl
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }, { name: fileId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MultipartPartInput" } } } }
      responses: { "200": { description: Part upload URL, content: { application/json: { schema: { type: object, required: [uploadURL], properties: { uploadURL: { type: string } } } } } } }
  /creator/digital-products/{productId}/files/{fileId}/finalize:
    post:
      operationId: finalizeDigitalFileUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }, { name: fileId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MultipartCompleteInput" } } } }
      responses: { "200": { description: Uploaded file, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalFile" } } } } }
  /creator/digital-products/{productId}/files/{fileId}/abort:
    post:
      operationId: abortDigitalFileUpload
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }, { name: fileId, in: path, required: true, schema: { type: integer } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MultipartAbortInput" } } } }
      responses: { "204": { description: Upload aborted } }
  /creator/digital-products/{productId}/files/{fileId}:
    delete:
      operationId: deleteDigitalProductFile
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }, { name: fileId, in: path, required: true, schema: { type: integer } }]
      responses: { "204": { description: File removed } }
  /student/digital-products/{productId}/acquire:
    post:
      operationId: acquireDigitalProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Already owned, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalAcquisition" } } } }, "201": { description: Acquired, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalAcquisition" } } } } }
  /student/digital-products:
    get:
      operationId: listStudentDigitalProducts
      security: [{ cookieAuth: [] }]
      responses: { "200": { description: Owned products, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DigitalProduct" } } } } } }
  /student/digital-products/{productId}:
    get:
      operationId: getStudentDigitalProduct
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Owned product, content: { application/json: { schema: { $ref: "#/components/schemas/DigitalProductDetail" } } } } }
  /student/digital-products/{productId}/files/{fileId}/download:
    get:
      operationId: downloadDigitalProductFile
      security: [{ cookieAuth: [] }]
      parameters: [{ name: productId, in: path, required: true, schema: { type: integer } }, { name: fileId, in: path, required: true, schema: { type: integer } }]
      responses: { "307": { description: Short-lived signed download redirect } }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: lms_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    SignUpInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    Session:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
    CourseBasicsInput:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        level: { type: string }
        outcomes: { type: array, items: { type: string } }
        faqs: { type: array, items: { $ref: "#/components/schemas/CourseFaq" } }
    ImageUploadInput:
      type: object
      required: [filename, mimeType, sizeBytes]
      properties:
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
    ImageUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    ImageFinalizeInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string }
    ModuleInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
    LessonInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, nullable: true }
        isPreview: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/LessonAsset" } }
    ModuleReorderInput:
      type: object
      required: [moduleIds]
      properties:
        moduleIds: { type: array, items: { type: integer } }
    LessonReorderInput:
      type: object
      required: [lessonIds]
      properties:
        lessonIds: { type: array, items: { type: integer } }
    Lesson:
      type: object
      required: [id, moduleId, title, position, isPreview]
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        position: { type: integer }
        isPreview: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/LessonAsset" } }
    Module:
      type: object
      required: [id, courseId, title, position]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        position: { type: integer }
        lessons: { type: array, items: { $ref: "#/components/schemas/Lesson" } }
    CourseBuilder:
      type: object
      required: [product, course, modules]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        course: { type: object }
        modules: { type: array, items: { $ref: "#/components/schemas/Module" } }
    CourseReadiness:
      type: object
      required: [ready, checks, moduleCount, lessonCount]
      properties:
        ready: { type: boolean }
        checks: { type: object, additionalProperties: { type: boolean } }
        moduleCount: { type: integer }
        lessonCount: { type: integer }
    CreatorApplicationInput:
      type: object
      required: [displayName, headline, bio, expertise, courseProposal, targetAudience, motivation, teachingTopics]
      properties:
        displayName: { type: string, minLength: 2 }
        headline: { type: string, minLength: 2 }
        bio: { type: string, minLength: 20 }
        expertise: { type: string, minLength: 2 }
        experienceYears: { type: integer, minimum: 0 }
        portfolioUrl: { type: string, nullable: true }
        linkedinUrl: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        teachingTopics: { type: array, items: { type: string } }
        courseProposal: { type: string, minLength: 20 }
        targetAudience: { type: string, minLength: 2 }
        sampleWorkUrl: { type: string, nullable: true }
        motivation: { type: string, minLength: 20 }
    CreatorApplication:
      allOf:
        - $ref: "#/components/schemas/CreatorApplicationInput"
        - type: object
          required: [id, userId, status, createdAt, updatedAt]
          properties:
            id: { type: integer }
            userId: { type: integer }
            status: { type: string, enum: [pending, approved, rejected] }
            reviewReason: { type: string, nullable: true }
            reviewedAt: { type: string, format: date-time, nullable: true }
            reviewedBy: { type: integer, nullable: true }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    RejectCreatorApplicationInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }
    User:
      type: object
      required: [id, email, name, role]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [student, creator, admin]
        isSuperAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
    AdminCreatorRoleInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    AdminEnrollmentInput:
      type: object
      required: [courseId]
      properties:
        courseId: { type: integer }
    Course:
      type: object
      required: [id, title, description, level, lessons]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        outcomes:
          type: array
          items: { type: string }
        faqs:
          type: array
          items: { $ref: "#/components/schemas/CourseFaq" }
        modules:
          type: array
          items: { $ref: "#/components/schemas/Module" }
        creatorName:
          type: ["string", "null"]
        enrolled:
          type: boolean
        level:
          type: string
        lessons:
          type: integer
        productId:
          type: integer
          nullable: true
    CourseFaq:
      type: object
      required: [question, answer]
      properties:
        question: { type: string, minLength: 1 }
        answer: { type: string, minLength: 1 }
    EnrollmentResult:
      type: object
      required: [enrolled, alreadyEnrolled, courseId]
      properties:
        enrolled: { type: boolean }
        alreadyEnrolled: { type: boolean }
        courseId: { type: integer }
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
    Product:
      type: object
      required: [id, title, description, type, priceMinor, currency, status]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        shortSummary: { type: ["string", "null"] }
        subtype: { type: ["string", "null"], enum: [ebook, template, toolkit, document, bundle, other, null] }
        coverImageUrl: { type: ["string", "null"] }
        type: { type: string, enum: [course, digital] }
        priceMinor: { type: integer, minimum: 0 }
        currency: { type: string }
        status: { type: string, enum: [draft, published, archived] }
    ProductInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 2 }
        description: { type: string }
        shortSummary: { type: string }
        subtype: { type: string, enum: [ebook, template, toolkit, document, bundle, other] }
        coverImageUrl: { type: string }
        type: { type: string, enum: [course, digital] }
        priceMinor: { type: integer, minimum: 0 }
        currency: { type: string }
        courseId: { type: integer }
        categoryId: { type: integer }
    DigitalFile:
      type: object
      required: [id, productId, kind, filename, status, position]
      properties:
        id: { type: integer }
        productId: { type: integer }
        kind: { type: string }
        filename: { type: string }
        mimeType: { type: ["string", "null"] }
        sizeBytes: { type: ["integer", "null"] }
        status: { type: string, enum: [pending, uploaded, failed] }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
    DigitalProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [isFree]
          properties:
            isFree: { type: boolean, const: true }
            acquiredAt: { type: ["string", "null"], format: date-time }
    DigitalProductDetail:
      allOf:
        - $ref: "#/components/schemas/DigitalProduct"
        - type: object
          required: [files]
          properties:
            creatorName: { type: ["string", "null"] }
            files: { type: array, items: { $ref: "#/components/schemas/DigitalFile" } }
    DigitalFileUploadInput:
      type: object
      required: [filename, mimeType, sizeBytes]
      properties:
        filename: { type: string, minLength: 1 }
        mimeType: { type: string, minLength: 1 }
        sizeBytes: { type: integer, minimum: 1, maximum: 262144000 }
    DigitalFileUploadResponse:
      type: object
      required: [file, uploadId, partSize]
      properties:
        file: { $ref: "#/components/schemas/DigitalFile" }
        uploadId: { type: string }
        partSize: { type: integer }
    DigitalAcquisition:
      type: object
      required: [productId, acquired, alreadyOwned]
      properties:
        productId: { type: integer }
        acquired: { type: boolean }
        alreadyOwned: { type: boolean }
    DigitalProductReadiness:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks:
          type: object
          required: [title, description, subtype, files, free]
          properties:
            title: { type: boolean }
            description: { type: boolean }
            subtype: { type: boolean }
            files: { type: boolean }
            free: { type: boolean }
    AdminCourseInput:
      type: object
      required: [creatorId, title, description, priceMinor, currency]
      properties:
        creatorId: { type: integer }
        title: { type: string, minLength: 2 }
        description: { type: string }
        priceMinor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    AdminCreatedCourse:
      type: object
      required: [courseId, productId]
      properties:
        courseId: { type: integer }
        productId: { type: integer }
    AdminCourse:
      type: object
      required: [id, title, description, status, priceMinor, currency, productId, creatorId, creatorName, creatorEmail, moduleCount, lessonCount]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        priceMinor: { type: integer }
        currency: { type: string }
        productId: { type: integer, nullable: true }
        creatorId: { type: integer }
        creatorName: { type: string }
        creatorEmail: { type: string }
        moduleCount: { type: integer }
        lessonCount: { type: integer }
    VideoUploadInput:
      type: object
      required: [filename, mimeType, sizeBytes]
      properties:
        filename: { type: string }
        mimeType: { type: string, minLength: 1 }
        sizeBytes: { type: integer, minimum: 1, maximum: 10737418240 }
        kind: { type: string, enum: [video, document, other] }
    MultipartPartInput:
      type: object
      required: [uploadId, partNumber]
      properties:
        uploadId: { type: string }
        partNumber: { type: integer, minimum: 1, maximum: 10000 }
    MultipartCompleteInput:
      type: object
      required: [uploadId, parts]
      properties:
        uploadId: { type: string }
        parts:
          type: array
          minItems: 1
          items:
            type: object
            required: [partNumber, eTag]
            properties:
              partNumber: { type: integer, minimum: 1, maximum: 10000 }
              eTag: { type: string }
    MultipartAbortInput:
      type: object
      required: [uploadId]
      properties:
        uploadId: { type: string }
    LessonAsset:
      type: object
      required: [id, lessonId, kind, filename, mimeType, sizeBytes, status]
      properties:
        id: { type: integer }
        lessonId: { type: integer }
        kind: { type: string, enum: [video, document, audio, image, other] }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string, enum: [pending, uploaded, failed] }
        downloadUrl: { type: string }
    StudentLessonAsset:
      type: object
      required: [id, lessonId, kind, filename, mimeType, sizeBytes, status, streamUrl]
      properties:
        id: { type: integer }
        lessonId: { type: integer }
        kind: { type: string, enum: [video, document, audio, image, other] }
        filename: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer }
        status: { type: string, enum: [uploaded] }
        streamUrl: { type: string }
        downloadUrl: { type: string }
    StudentLesson:
      type: object
      required: [id, moduleId, title, position, isPreview, assets]
      properties:
        id: { type: integer }
        moduleId: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        position: { type: integer }
        isPreview: { type: boolean }
        assets: { type: array, items: { $ref: "#/components/schemas/StudentLessonAsset" } }
    StudentModule:
      type: object
      required: [id, courseId, title, position, lessons]
      properties:
        id: { type: integer }
        courseId: { type: integer }
        title: { type: string }
        position: { type: integer }
        lessons: { type: array, items: { $ref: "#/components/schemas/StudentLesson" } }
    StudentCourse:
      type: object
      required: [id, title, description, level, lessons, modules]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        thumbnailUrl: { type: ["string", "null"] }
        outcomes: { type: array, items: { type: string } }
        faqs: { type: array, items: { $ref: "#/components/schemas/CourseFaq" } }
        creatorName: { type: ["string", "null"] }
        level: { type: string }
        lessons: { type: integer }
        productId: { type: integer, nullable: true }
        modules: { type: array, items: { $ref: "#/components/schemas/StudentModule" } }
    VideoUploadResponse:
      type: object
      required: [uploadURL, asset]
      properties:
        uploadURL: { type: string, format: uri }
        asset: { $ref: "#/components/schemas/LessonAsset" }
    CourseOutlineInput:
      type: object
      required: [topic, audience, level, sectionCount]
      properties:
        topic: { type: string }
        audience: { type: string }
        level: { type: string }
        sectionCount: { type: integer, minimum: 1, maximum: 20 }
    CourseOutline:
      type: object
      required: [title, description, sections]
      properties:
        title: { type: string }
        description: { type: string }
        sections:
          type: array
          items:
            type: object
            required: [title, lessons]
            properties:
              title: { type: string }
              lessons:
                type: array
                items:
                  type: object
                  required: [title]
                  properties:
                    title: { type: string }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        description: { type: string }
    AdminUpdateSettingInput:
      type: object
      required: [value]
      properties:
        value: { type: string }
    SalesSummary:
      type: object
      required: [orderCount, grossMinor, orders]
      properties:
        orderCount: { type: integer }
        grossMinor: { type: integer }
        orders: { type: array, items: { type: object } }
    LiveClassInput:
      type: object
      required: [title, startsAt, endsAt, timezone]
      properties:
